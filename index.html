<title>Облако</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Раскладка: узкая колонка как в приложении, шапка сверху, нижняя панель с разделами. Цвета: небо, облако, солнечный акцент для напоминаний. */
:root{
  --bg:#eef5fb; --surface:#ffffff; --ink:#16283d; --muted:#586e86; --line:#d5e2ee;
  --accent:#2c7be5; --accent-ink:#ffffff; --soft:#dcebfb; --sun:#ffb73d; --sun-soft:#fff1d2;
  --bad:#d3433d; --bad-soft:#fde6e4; --ok:#25865c;
  --pink:#ffb3d1; --cloud:#ffffff; --cloud-o:.75;
  --f-display:'Fredoka','Nunito',system-ui,sans-serif; --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1a29; --surface:#162637; --ink:#e7eff8; --muted:#92a8bf; --line:#25405a;
  --accent:#5aa4ff; --accent-ink:#08213d; --soft:#1e3752; --sun:#ffc255; --sun-soft:#3a3016;
  --bad:#ff7b72; --bad-soft:#3d1f22; --ok:#4fc58f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1a29; --surface:#162637; --ink:#e7eff8; --muted:#92a8bf; --line:#25405a;
  --accent:#5aa4ff; --accent-ink:#08213d; --soft:#1e3752; --sun:#ffc255; --sun-soft:#3a3016;
  --bad:#ff7b72; --bad-soft:#3d1f22; --ok:#4fc58f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
.wrap{max-width:640px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance}
h1{font-size:1.7rem;line-height:1.15} h2{font-size:1.2rem} h3{font-size:1.02rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 6px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:600;font-size:1.35rem}
.brand svg{width:38px;height:38px}
.ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:44px;height:44px;display:grid;place-items:center;cursor:pointer}
.iconbtn[aria-current="true"]{background:var(--soft);border-color:var(--accent)}
main{display:flex;flex-direction:column;gap:14px;padding-top:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0}
.hero{background:var(--accent);color:var(--accent-ink);border-color:transparent;display:flex;gap:14px;align-items:center}
.hero p{opacity:.95}
.hero svg{width:76px;height:76px;flex:none}
.row{display:flex;gap:10px;align-items:center;min-width:0}
.grow{flex:1;min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.85rem}
.stat.warn{background:var(--sun-soft);border-color:var(--sun)}
label{display:flex;flex-direction:column;gap:5px;font-size:.88rem;color:var(--muted);font-weight:600}
input[type=text],input[type=time],input[type=datetime-local],select,textarea{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--ink);min-height:46px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
textarea{resize:vertical}
.form{display:flex;flex-direction:column;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:11px 18px;font-weight:700;cursor:pointer;min-height:46px}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.small{min-height:38px;padding:6px 12px;font-size:.9rem}
.btn:disabled{opacity:.55}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:600;min-height:40px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.task{display:flex;gap:12px;align-items:flex-start}
.check{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--accent);background:transparent;flex:none;cursor:pointer;display:grid;place-items:center;color:var(--accent-ink);margin-top:2px}
.check[aria-checked="true"]{background:var(--ok);border-color:var(--ok)}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.t{font-weight:700;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:.88rem;overflow-wrap:anywhere}
.late .meta.due{color:var(--bad);font-weight:700}
.tag{display:inline-block;font-size:.72rem;font-weight:700;background:var(--sun-soft);color:var(--ink);border-radius:8px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.acts{display:flex;gap:6px;flex:none}
.acts .btn{min-height:40px;padding:6px 10px}
.empty{text-align:center;color:var(--muted);padding:22px 8px}
.chat{display:flex;flex-direction:column;gap:8px}
.bub{max-width:88%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:5px}
.bub.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.send{display:flex;gap:8px}
.answer{white-space:pre-wrap;overflow-wrap:anywhere}
.answer ol{margin:8px 0 0;padding-left:22px}
details{margin-top:10px} summary{cursor:pointer;font-weight:700;color:var(--accent)}
.sw{flex-direction:row;align-items:center;gap:12px;color:var(--ink);font-size:1rem}
.sw input{width:24px;height:24px;accent-color:var(--accent)}
.toasts{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;z-index:30;max-width:616px;margin:0 auto}
.toast{background:var(--sun-soft);border:2px solid var(--sun);border-radius:14px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.18);cursor:pointer}
.toast b{display:block}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav .in{display:flex;max-width:640px;margin:0 auto;gap:4px}
nav button{flex:1;background:none;border:0;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:.72rem;font-weight:700;color:var(--muted);cursor:pointer;min-height:54px}
nav button[aria-current="true"]{background:var(--soft);color:var(--accent)}
@media (max-width:420px){.two{grid-template-columns:1fr}.hero svg{width:60px;height:60px}h1{font-size:1.5rem}}

/* облака на фоне, детский режим, анимации */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--cloud:#9db8d6;--cloud-o:.08}}
:root[data-theme="dark"]{--cloud:#9db8d6;--cloud-o:.08}
.sky{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.sky svg{position:absolute;left:-260px;fill:var(--cloud);opacity:var(--cloud-o)}
.sky .c1{top:9%;width:150px}.sky .c2{top:33%;width:230px}.sky .c3{top:60%;width:120px}.sky .c4{top:80%;width:190px}
.wrap{position:relative;z-index:1}
.hero{background:linear-gradient(135deg,var(--hero-a,var(--accent)),var(--hero-b,var(--accent)));color:var(--hero-ink,var(--accent-ink))}
.stars{font-family:var(--f-display);font-size:1.3rem;background:var(--sun-soft);border-radius:999px;padding:6px 14px;white-space:nowrap}
.bar{height:14px;background:var(--soft);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--pink));border-radius:999px}
.burst{position:fixed;z-index:40;pointer-events:none;width:0;height:0}
.burst i{position:absolute;left:0;top:0;font-style:normal;animation:fly .85s ease-out forwards}
.burst .dot{width:9px;height:9px;margin:-4px;border-radius:50%;background:var(--sun)}
.burst .st{font-size:20px;line-height:1;margin:-10px;color:var(--sun)}
@keyframes fly{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.15);opacity:0}}

html.kid:root{--bg:#e8f5ff;--surface:#ffffff;--ink:#2a3560;--muted:#65739f;--line:#c9e3fb;--accent:#1b7fe0;--accent-ink:#ffffff;--soft:#d9efff;--sun:#ffc83d;--sun-soft:#fff3cc;--bad:#d9425b;--bad-soft:#ffe3e8;--ok:#1f9d68;--hero-a:#9bd8ff;--hero-b:#ffc6e2;--hero-ink:#243060;--cloud:#ffffff;--cloud-o:.95}
@media (prefers-color-scheme:dark){html.kid:root:not([data-theme="light"]){--bg:#1b2146;--surface:#262e5c;--ink:#f2f4ff;--muted:#aab4e6;--line:#3a4380;--accent:#7cc4ff;--accent-ink:#10224a;--soft:#323c7a;--sun:#ffd466;--sun-soft:#4a4430;--bad:#ff8fa0;--bad-soft:#4d2a45;--ok:#6fe0ae;--hero-a:#4a63c9;--hero-b:#a2559f;--hero-ink:#ffffff;--cloud:#ffffff;--cloud-o:.12;color-scheme:dark}}
html.kid:root[data-theme="dark"]{--bg:#1b2146;--surface:#262e5c;--ink:#f2f4ff;--muted:#aab4e6;--line:#3a4380;--accent:#7cc4ff;--accent-ink:#10224a;--soft:#323c7a;--sun:#ffd466;--sun-soft:#4a4430;--bad:#ff8fa0;--bad-soft:#4d2a45;--ok:#6fe0ae;--hero-a:#4a63c9;--hero-b:#a2559f;--hero-ink:#ffffff;--cloud:#ffffff;--cloud-o:.12;color-scheme:dark}
html.kid body{font-size:17px}
html.kid .card,html.kid .stat{border-radius:26px;border-width:2px}
html.kid .hero{border-radius:30px;position:relative;overflow:hidden}
html.kid .hero::before,html.kid .hero::after{content:"✦";position:absolute;color:#fff;opacity:.85;font-size:18px}
html.kid .hero::before{top:10px;right:18px}
html.kid .hero::after{bottom:10px;right:56px;font-size:13px}
html.kid .btn,html.kid .chip{border-radius:999px}
html.kid input[type=text],html.kid input[type=time],html.kid input[type=datetime-local],html.kid select,html.kid textarea{border-radius:18px}
html.kid nav{border-radius:26px 26px 0 0;border-top-width:3px}
html.kid nav button{border-radius:20px}
html.kid .brand{color:var(--accent)}

@media (prefers-reduced-motion:no-preference){
  .sky .c1{animation:drift 75s linear -25s infinite}
  .sky .c2{animation:drift 115s linear -70s infinite}
  .sky .c3{animation:drift 62s linear -10s infinite}
  .sky .c4{animation:drift 135s linear -95s infinite}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(calc(100vw + 520px))}}
  #view.enter>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
  #view.enter>*:nth-child(2){animation-delay:.06s}
  #view.enter>*:nth-child(3){animation-delay:.12s}
  #view.enter>*:nth-child(4){animation-delay:.18s}
  #view.enter>*:nth-child(5){animation-delay:.24s}
  #view.enter>*:nth-child(n+6){animation-delay:.3s}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .btn,.chip,.check,.iconbtn,nav button{transition:transform .12s ease,background-color .2s,border-color .2s}
  .btn:active,.chip:active,.check:active,.iconbtn:active,nav button:active{transform:scale(.93)}
  .entering nav button[aria-current="true"] svg{animation:pop .55s}
  @keyframes pop{40%{transform:scale(1.35) rotate(-8deg)}}
  .toast{animation:slidein .35s cubic-bezier(.2,.8,.2,1)}
  @keyframes slidein{from{transform:translateY(-22px);opacity:0}}
  .btn[aria-pressed="true"]{animation:pulse 1.2s infinite}
  @keyframes pulse{from{box-shadow:0 0 0 0 var(--accent)}to{box-shadow:0 0 0 14px transparent}}
  .bar i{animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
  @keyframes grow{from{width:0}}
  html.kid .hero::before{animation:twinkle 2.4s ease-in-out infinite}
  html.kid .hero::after{animation:twinkle 2.4s ease-in-out -1.2s infinite}
  @keyframes twinkle{50%{opacity:.2;transform:scale(.6)}}
}
html.noanim *,html.noanim *::before,html.noanim *::after{animation:none!important;transition:none!important}
html.noanim .conf{display:none}

/* облачка, мини-игры, магазин */
[hidden]{display:none!important}
.pill{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 14px;height:44px;cursor:pointer;font-weight:800;color:var(--ink)}
.cc{width:24px;height:12px;fill:var(--accent);flex:none}
.mas{display:flex;justify-content:center;flex:none}
.earn{display:inline-flex;align-items:center;gap:8px;font-size:1.25rem;font-weight:800;background:var(--sun-soft);padding:6px 16px;border-radius:999px}
.item{display:flex;align-items:center;gap:12px}
.item .grow b{display:block}
.game{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;display:flex;flex-direction:column;gap:12px;padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.gbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.field{position:relative;height:min(68vh,560px);border-radius:20px;background:linear-gradient(var(--soft),var(--bg));overflow:hidden;touch-action:manipulation;border:1px solid var(--line)}
.gc{position:absolute;left:0;top:0;width:68px;height:44px;padding:0;border:0;background:none;cursor:pointer;will-change:transform}
.gc svg{width:100%;height:100%;fill:var(--accent)}
.gc.gold svg{fill:#ffc83d}.gc.storm svg{fill:#47506a}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mc{aspect-ratio:1;border-radius:16px;border:2px solid var(--line);background:var(--soft);font-size:2rem;cursor:pointer;color:var(--ink);padding:0}
.mc.up{background:var(--surface)}.mc.ok{background:var(--sun-soft);border-color:var(--sun)}
.q{font-family:var(--f-display);font-size:2.3rem;text-align:center;margin:10px 0 16px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opt{min-height:66px;font-size:1.5rem}
.simon{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.pad{min-height:112px;border-radius:22px;border:3px solid transparent;background:var(--c);opacity:.5;font-size:2.4rem;color:#16283d;cursor:pointer}
.pad.lit{opacity:1;border-color:var(--ink);transform:scale(1.04)}
.gres{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.gres .big{font-size:1.4rem;font-weight:800}
html.skin-sunset:root{--bg:#fff1e8;--line:#f3d3c0;--accent:#c94a17;--accent-ink:#ffffff;--soft:#ffe1cf;--hero-a:#ffb27a;--hero-b:#ff8fa3;--hero-ink:#4a1d10}
html.skin-space:root{--bg:#eceeff;--line:#cfd3f5;--accent:#4a3fd1;--accent-ink:#ffffff;--soft:#dcdfff;--hero-a:#5a52e0;--hero-b:#1f2a6b;--hero-ink:#ffffff}
html.skin-mint:root{--bg:#e9f8f1;--line:#c5e8d9;--accent:#0f8a5f;--accent-ink:#ffffff;--soft:#d3f1e3;--hero-a:#8fe3bf;--hero-b:#bfe9ff;--hero-ink:#0f3a2b}
@media (prefers-color-scheme:dark){
  html.skin-sunset:root:not([data-theme="light"]){--bg:#2a1620;--line:#5a3040;--accent:#ffa06b;--accent-ink:#3a1305;--soft:#4a2633;--hero-a:#b5482f;--hero-b:#8f2e5a;--hero-ink:#ffffff}
  html.skin-space:root:not([data-theme="light"]){--bg:#0a0d24;--line:#262d63;--accent:#9aa5ff;--accent-ink:#0c1030;--soft:#1b2150;--hero-a:#3a35a8;--hero-b:#101a50;--hero-ink:#ffffff}
  html.skin-mint:root:not([data-theme="light"]){--bg:#0d201b;--line:#1f4a3d;--accent:#5fd9a8;--accent-ink:#04251a;--soft:#153a30;--hero-a:#1f7a5c;--hero-b:#1c5f7a;--hero-ink:#ffffff}
}
html.skin-sunset:root[data-theme="dark"]{--bg:#2a1620;--line:#5a3040;--accent:#ffa06b;--accent-ink:#3a1305;--soft:#4a2633;--hero-a:#b5482f;--hero-b:#8f2e5a;--hero-ink:#ffffff}
html.skin-space:root[data-theme="dark"]{--bg:#0a0d24;--line:#262d63;--accent:#9aa5ff;--accent-ink:#0c1030;--soft:#1b2150;--hero-a:#3a35a8;--hero-b:#101a50;--hero-ink:#ffffff}
html.skin-mint:root[data-theme="dark"]{--bg:#0d201b;--line:#1f4a3d;--accent:#5fd9a8;--accent-ink:#04251a;--soft:#153a30;--hero-a:#1f7a5c;--hero-b:#1c5f7a;--hero-ink:#ffffff}

.thumb{width:56px;height:56px;flex:none;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#9fd0ff,#5a9bf0);border-radius:16px}.pv{background:linear-gradient(135deg,#9fd0ff,#5a9bf0);border-radius:28px;padding:10px;display:inline-flex}.thumb svg{width:56px;height:56px}
.sk{width:46px;height:46px;border-radius:50%;flex:none;border:2px solid var(--line)}
.swat{width:40px;height:40px;border-radius:50%;border:3px solid var(--line);padding:0;cursor:pointer;flex:none}.swat[aria-pressed="true"]{border-color:var(--ink);transform:scale(1.12)}
.sws{display:flex;flex-wrap:wrap;gap:10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:8px 4px;cursor:pointer;font-size:.78rem;font-weight:700;color:var(--ink);text-align:center;line-height:1.2}
.tile[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}.tile.lock .thumb{opacity:.55}.tile small{font-weight:600;color:var(--muted)}
.prev{display:flex;gap:14px;justify-content:center;align-items:flex-end}.prev figure{margin:0;text-align:center}.prev figcaption{font-weight:800;font-size:.85rem;margin-top:4px}
.react{width:100%;height:min(58vh,420px);border-radius:24px;border:0;font-size:2rem;font-weight:800;color:#16283d;cursor:pointer;padding:12px}
.mc.hole{font-size:2.2rem}
.slots{font-family:var(--f-display);font-size:2rem;text-align:center;letter-spacing:.25em;margin:8px 0 14px;min-height:2.4rem}
.lets{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.lets .btn{min-width:48px;min-height:52px;font-size:1.3rem;padding:6px 12px}
@keyframes tw{50%{opacity:.3}}

/* ещё, проекты, рисовалка, 3D */
.mrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;color:var(--ink);font:inherit}
.mrow .grow b{display:block}
.mic{width:46px;height:46px;border-radius:14px;background:var(--soft);color:var(--accent);display:grid;place-items:center;flex:none}
.dwrap,.mwrap{position:relative;border-radius:18px;overflow:hidden;touch-action:none;border:1px solid var(--line);aspect-ratio:4/3;width:100%;user-select:none;-webkit-user-select:none}
.dwrap{background:#fff;background-image:linear-gradient(45deg,#f3f6fa 25%,transparent 25%,transparent 75%,#f3f6fa 75%),linear-gradient(45deg,#f3f6fa 25%,transparent 25%,transparent 75%,#f3f6fa 75%);background-size:20px 20px;background-position:0 0,10px 10px}
.mwrap{background:linear-gradient(#bfe0ff,#eaf5ff)}
.dwrap canvas,.mwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.don{opacity:.3;pointer-events:none}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;-webkit-overflow-scrolling:touch}
.fr{flex:none;width:84px;border:2.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;cursor:pointer;padding:0;position:relative}
.fr img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}

function fmtDue(iso){
  if(!iso)return 'без срока';
  var d=new Date(iso),n=new Date(),t=pad(d.getHours())+':'+pad(d.getMinutes());

}

    tmo=setTimeout(function(){fail('timeout')},40000);

      var w=v.videoWidth||640,h=v.videoHeight||360,sc=Math.min(1,640/Math.max(w,h)),cw=Math.max(2,Math.round(w*sc)),ch=Math.max(2,Math.round(h*sc));
      var cv=document.createElement('canvas');cv.width=cw;cv.height=ch;var cx=cv.getContext('2d');

      v.onseeked=function(){
        cx.drawImage(v,0,0,cw,ch);out.push(cv.toDataURL('image/jpeg',.72));i++;

function parseWhen(s){

  var m=t.match(/(?:^|\s)в\s+(\d{1,2})(?:[:.](\d{2}))?(?!\d)/i);

    base=base||new Date(now);base.setHours(+m[1],+(m[2]||0),0,0);

function checkMath(text){

    var p=l.split('=');if(!p[0]||!p[1])return;
    try{
      var L=Function('"use strict";return ('+p[0]+')')(),R=Function('"use strict";return ('+p[1]+')')();
      if(typeof L!=='number'||typeof R!=='number'||!isFinite(L)||!isFinite(R))return;

function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t}return a}

function stepList(e){
  function flat(str){
    var m=str.match(/(\d+(?:\.\d+)?)([*\/])(\d+(?:\.\d+)?)/)||str.match(/(-?\d+(?:\.\d+)?)([+\-])(\d+(?:\.\d+)?)/);

  }
  var out=[e],cur=e,n=0;

function solveMath(text){

var LOCAL_RE=/^(Записала|Запомнила|Добавила дело|Хорошо\. Где|Что именно нужно)/;
function fmtMsg(t){
  if(t==='…')return '<span class="dots"><i></i><i></i><i></i></span>';
  return esc(t).replace(/```(?:\w+)?\n?([\s\S]*?)```/g,'<pre>$1</pre>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`\n]+)`/g,'<code>$1</code>');
}
function paintBot(bm){
  if(S.tab!=='chat')return;var m=document.getElementById('msgs');
  if(m&&m.lastElementChild){m.lastElementChild.innerHTML=fmtMsg(bm.t);m.lastElementChild.scrollIntoView({block:'end'})}
}
function streamBot(bm,raw){var sp=splitEmo(raw);bm.t=sp.body||'…';if(sp.emo){bm.emo=sp.emo;setEmo(sp.emo)}paintBot(bm)}
function finishBot(bm,raw,voice){
  var sp=splitEmo(raw);bm.t=sp.body||raw||'…';bm.emo=sp.emo||guessEmo(bm.t);setEmo(bm.emo);save();paintBot(bm);
  if(voice?S.speak:S.speakChat)speak(bm.t,bm.emo,true);
}
function say(text,voice){
  var t=text.trim();if(!t)return;
  var hadAsk=!!ASK,rp=assistant(t),local=hadAsk&&/^Записала/.test(rp)||LOCAL_RE.test(rp),bm={me:false,t:local?rp:'…'};
  S.chat.push({me:true,t:t});S.chat.push(bm);
  if(S.chat.length>80)S.chat=S.chat.slice(-80);
  if(!local){
    setEmo('think');
    askAI(chatPrompt(t),function(x){streamBot(bm,x)}).then(function(a){finishBot(bm,a,voice)})
      .catch(function(){
        var msg=/^Пока я не знаю/.test(rp)?'Сейчас я не могу ответить как ИИ: '+AI_ERR+'. Нажми «Проверить ИИ» над строкой ввода. Пока я умею записывать дела и вещи и отвечать на готовые вопросы.':rp;
        bm.t=msg;bm.emo='sad';setEmo('sad');save();paintBot(bm);if(voice)speak(msg,'sad');
      });
  }else{bm.emo=guessEmo(rp);setEmo(bm.emo);if(voice){speak(rp,bm.emo);if(S.tab!=='chat')toast('Облако',rp)}else if(S.speakChat)speak(rp,bm.emo,true)}
  if(!voice)S.tab='chat';save();render();
  var el=document.getElementById('c-in');if(el&&!voice)el.focus();
}
function handleVideo(file){
  if(!file)return;
  var inp=document.getElementById('c-in'),q=(inp&&inp.value.trim())||'Расскажи, что происходит на видео.';if(inp)inp.value='';
  var bm={me:false,t:'…'};
  S.chat.push({me:true,t:'Видео: '+file.name+'\n'+q});S.chat.push(bm);if(S.chat.length>80)S.chat=S.chat.slice(-80);
  S.tab='chat';save();render();setEmo('think');toast('Облако','Смотрю видео…');

var SAMPLE=null,SAMPLE_P=null;
function getSample(){
  if(SAMPLE_P)return SAMPLE_P;
  SAMPLE_P=new Promise(function(res){
    try{
      if(window.claude&&window.claude.use){window.claude.use('sample').then(function(s){SAMPLE=s||null;res(SAMPLE)}).catch(function(){res(null)})}
      else res(null);
    }catch(e){res(null)}
  });
  return SAMPLE_P;
}
var AI_ERR='';
function aiReason(e){
  var c=e&&e.code,st=e&&e.status;
  if(st===401||st===403)return 'ключ Groq не подошёл, проверь его в настройках';
  if(st===429||c==='rate_limited')return 'слишком много запросов, подожди минуту';
  if(st)return 'Groq ответил ошибкой '+st+(e.vision?' (модель для видео в предпросмотре и могла измениться)':'');
  if(c==='not_granted')return 'не дано разрешение';
  if(e&&e.message==='no-vision')return 'в этом окне ИИ не умеет смотреть картинки, добавь ключ Groq';
  if(e&&e.message==='no-sample')return 'нет ключа Groq, а в этом окне нет встроенного ИИ';
  return 'нет связи с ИИ';
}
var GROQ_TEXT='llama-3.3-70b-versatile',GROQ_VISION='qwen/qwen3.8-27b';
function askGroq(prompt,onText,images){
  var content=images&&images.length?[{type:'text',text:prompt}].concat(images.map(function(u){return {type:'image_url',image_url:{url:u}}})):prompt;
  return fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.groqKey},
    body:JSON.stringify({model:images&&images.length?GROQ_VISION:GROQ_TEXT,messages:[{role:'user',content:content}],stream:true,temperature:.8,max_tokens:1200})}).then(function(r){
    if(!r.ok){var e=new Error('http');e.status=r.status;e.vision=!!(images&&images.length);throw e}
    if(!r.body||!r.body.getReader)return r.text().then(function(){throw new Error('nostream')});
    var rd=r.body.getReader(),dec=new TextDecoder(),buf='',out='';
    function pump(){
      return rd.read().then(function(x){
        if(x.done)return out;
        buf+=dec.decode(x.value,{stream:true});var lines=buf.split('\n');buf=lines.pop();
        lines.forEach(function(l){
          l=l.trim();if(l.indexOf('data:')!==0)return;var d=l.slice(5).trim();if(d==='[DONE]')return;
          try{var j=JSON.parse(d),t=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;if(t){out+=t;if(onText)onText(out)}}catch(err){}
        });
        return pump();
      });
    }
    return pump();
  }).then(function(t){if(!t)throw new Error('empty');return t});
}
function dataToBlob(u){return fetch(u).then(function(r){return r.blob()})}
function askClaude(prompt,onText,images){
  return getSample().then(function(sm){
    if(!sm)throw new Error('no-sample');
    var opts={cache:false,onText:function(o){if(onText&&o&&o.text)onText(o.text)}};
    if(!(images&&images.length))return sm(prompt,opts);
    return Promise.resolve(sm.limits?sm.limits():{}).then(function(l){
      if(!l||!l.images)throw new Error('no-vision');
      return Promise.all(images.map(dataToBlob)).then(function(bl){opts.images=bl;return sm(prompt,opts)});
    });
  }).then(function(r){if(!r||!r.text)throw new Error('empty');return r.text});
}
function askAI(prompt,onText,images){
  var first=S.groqKey?askGroq(prompt,onText,images):askClaude(prompt,onText,images);
  return first.catch(function(e){
    if(S.groqKey){var ge=e;return askClaude(prompt,onText,images).catch(function(){throw ge})}
    throw e;
  }).then(function(t){AI_ERR='';return t},function(e){AI_ERR=aiReason(e);throw e});
}

function wakeLock(on){

function voiceFail(msg){
  VS=msg;WAKE=false;LISTENING=false;REC=null;wakeLock(false);
  S.tab='chat';save();render(true);toast('Микрофон',msg);
  var el=document.getElementById('c-in');if(el)el.focus();
}
function startVoice(wake){
  if(!SR){voiceFail('Это окно Claude не даёт приложению доступ к микрофону, это не поломка Облака. Выход: нажми значок микрофона на клавиатуре телефона и надиктуй команду в строку. Там голос работает.');return}
  try{
    var r=new SR();r.lang='ru-RU';r.continuous=!!wake;r.interimResults=false;
    r.onresult=function(ev){
      for(var i=ev.resultIndex;i<ev.results.length;i++){
        if(!ev.results[i].isFinal)continue;
        var tx=ev.results[i][0].transcript.trim(),has=/обл[аоы]к[оа]/i.test(tx);
        if(wake&&!has)continue;
        if(has)tx=tx.replace(/^.*?обл[аоы]к[оа][\s,.!:\-]*/i,'');
        say(tx||'привет',true);
      }
    };
    r.onerror=function(ev){
      var c=ev.error;
      if(c==='not-allowed'||c==='service-not-allowed'){voiceFail('Это окно Claude запрещает приложениям микрофон, поэтому кнопка не может его включить. Нажми значок микрофона на клавиатуре телефона и надиктуй команду в строку: Облако поймёт её так же.')}
      else if(c==='no-speech'){toast('Облако','Я ничего не услышала. Нажми на микрофон и скажи ещё раз.')}
      else if(c!=='aborted')voiceFail('Не получилось включить микрофон ('+c+'). Нажми значок микрофона на клавиатуре телефона и надиктуй команду в строку.');
    };
    r.onend=function(){
      REC=null;LISTENING=false;
      if(WAKE){setTimeout(function(){if(WAKE&&!REC)startVoice(true)},400)}
      else if(VS==='Говорю… слушаю тебя'||VS==='Слушаю…')setVS('');
    };
    REC=r;LISTENING=true;r.start();
    toast('Облако',wake?'Слушаю слово «Облако»…':'Слушаю, говори…');
    setVS(wake?'Слушаю слово «Облако»…':'Слушаю…');
  }catch(e){voiceFail('Не удалось включить микрофон. Нажми значок микрофона на клавиатуре телефона и надиктуй команду в строку.')}
}

function handScore(h){var t=0,a=0;h.forEach(function(c){if(c.r===12){a++;t+=11}else t+=c.r>=8?10:c.r+2});while(t>21&&a>0){t-=10;a--}return t}
function gTwentyOne(id){
  var deck=newDeck(),me=[deck.pop(),deck.pop()],bot=[deck.pop(),deck.pop()],over=false,to=0;
  function paint(reveal,msg){
    gBody('<p class="meta" style="text-align:center">Облако</p><div class="hand">'+bot.map(function(c,i){return cardHtml(c,!reveal&&i===1)}).join('')+'</div>'+
      '<p class="meta" style="text-align:center">Ты: '+handScore(me)+'</p><div class="hand">'+me.map(function(c){return cardHtml(c)}).join('')+'</div>'+
      '<p class="q" style="font-size:1.3rem;min-height:2rem">'+(msg||'Набери 21 или как можно ближе, но не больше.')+'</p>'+
      (over?'':'<div class="opts"><button class="btn opt" data-g="hit">Ещё карту</button><button class="btn opt ghost" data-g="stand">Хватит</button></div>'));
    gScore('Ты: '+handScore(me));
  }
  function finish(win){over=true;var r=win>0?8:win===0?4:2;paint(true,win>0?'Ты выиграла!':win===0?'Ничья':'Облако выиграло');to=setTimeout(function(){gEnd(id,win>0?3:win===0?1:0,r)},1300)}
  paint();
  if(handScore(me)===21)finish(handScore(bot)===21?0:1);
  G={stop:function(){clearTimeout(to)},on:function(v){
    if(over)return;
    if(v==='hit'){me.push(deck.pop());if(handScore(me)>21){finish(-1);return}if(handScore(me)===21){G.on('stand');return}paint();return}
    while(handScore(bot)<17)bot.push(deck.pop());
    var a=handScore(me),b=handScore(bot);finish(b>21||a>b?1:a===b?0:-1)
  }}
}

function gSnake(id){
  var N=15,sn=[{x:7,y:7},{x:6,y:7},{x:5,y:7}],dir={x:1,y:0},nd={x:1,y:0},ap=null,score=0,iv=0,cv,cx;
  gBody('<canvas class="snc" id="snc" width="450" height="450"></canvas><div class="dpad"><span></span><button class="btn" data-g="up" aria-label="Вверх">▲</button><span></span><button class="btn" data-g="left" aria-label="Влево">◀</button><button class="btn" data-g="down" aria-label="Вниз">▼</button><button class="btn" data-g="right" aria-label="Вправо">▶</button></div>');
  cv=document.getElementById('snc');cx=cv.getContext('2d');gScore('0');
  function place(){do{ap={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(sn.some(function(s){return s.x===ap.x&&s.y===ap.y}))}
  function turn(d){if(d.x===-dir.x&&d.y===-dir.y)return;nd=d}
  var DIRS={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
  function key(e){var m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(m){e.preventDefault();turn(DIRS[m])}}
  var sx=0,sy=0;
  cv.addEventListener('pointerdown',function(e){sx=e.clientX;sy=e.clientY});
  cv.addEventListener('pointerup',function(e){var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;turn(Math.abs(dx)>Math.abs(dy)?(dx>0?DIRS.right:DIRS.left):(dy>0?DIRS.down:DIRS.up))});
  document.addEventListener('keydown',key);
  function draw(){
    var u=cv.width/N;cx.fillStyle='#e9f6ff';cx.fillRect(0,0,cv.width,cv.height);
    cx.fillStyle='#f6fbff';for(var i=0;i<N;i++)for(var j=0;j<N;j++)if((i+j)%2)cx.fillRect(i*u,j*u,u,u);
    cx.fillStyle='#e5484d';cx.beginPath();cx.arc((ap.x+.5)*u,(ap.y+.5)*u,u*.36,0,Math.PI*2);cx.fill();
    sn.forEach(function(s,i){cx.fillStyle=i===0?'#1f6fd6':'#4b9bff';cx.beginPath();cx.roundRect?cx.roundRect(s.x*u+2,s.y*u+2,u-4,u-4,8):cx.rect(s.x*u+2,s.y*u+2,u-4,u-4);cx.fill()});
  }
  function step(){
    dir=nd;var h={x:sn[0].x+dir.x,y:sn[0].y+dir.y};
    if(h.x<0||h.y<0||h.x>=N||h.y>=N||sn.some(function(s){return s.x===h.x&&s.y===h.y})){gEnd(id,score,Math.min(20,score));return}
    sn.unshift(h);if(h.x===ap.x&&h.y===ap.y){score++;gScore(String(score));place()}else sn.pop();
    draw()
  }
  place();draw();iv=setInterval(step,150);
  G={stop:function(){clearInterval(iv);document.removeEventListener('keydown',key)},on:function(v){turn(DIRS[v])}}
}

  house:['Домик',function(){var o=[],x,y,z;for(x=1;x<=5;x++)for(z=1;z<=5;z++)for(y=0;y<3;y++){if(!(x===1||x===5||z===1||z===5))continue;if(x===3&&z===1&&y<2)continue;o.push([x,y,z,(y===1&&((z===3&&(x===1||x===5))||(x===3&&z===5)))?4:2])}
    box(1,5,3,3,1,5,0,o);box(2,4,4,4,2,4,0,o);box(3,3,5,5,3,3,0,o);return o}],
  tower:['Башня',function(){var o=[];box(2,4,0,5,2,4,9,o);[[2,2],[4,2],[2,4],[4,4],[3,3]].forEach(function(p){o.push([p[0],6,p[1],9])});o.push([3,6,3,11],[3,7,3,11],[3,7,4,0]);return o}],
  cloud:['Облако',function(){var o=[];box(1,6,2,2,3,4,8,o);box(2,5,3,3,3,4,8,o);box(3,4,4,4,3,4,8,o);o.push([3,3,2,10],[4,3,2,10],[3,2,2,7],[4,2,2,7]);return o}],
  pyramid:['Пирамида',function(){var o=[];box(0,7,0,0,0,7,2,o);box(1,6,1,1,1,6,2,o);box(2,5,2,2,2,5,2,o);box(3,4,3,3,3,4,1,o);return o}]
};
function mSample(id){var s=SAMPLES[id];if(!s)return;mPushUndo();mLoad(s[1]());mSave();mDraw()}
function mSaveModel(){
  var el=document.getElementById('m-name'),name=(el&&el.value.trim())||('Модель '+(S.models.length+1));
  if(!mCount()){toast('Облако','Сначала построй хоть один блок');return}
  mDraw();var t=compose(M.cv,180,135);
  var rec={id:uid(),name:name.slice(0,40),v:S.vox.slice(),thumb:t.toDataURL('image/jpeg',.65)};
  S.models.unshift(rec);if(S.models.length>10)S.models.length=10;
  try{localStorage.setItem(K,JSON.stringify(S))}catch(e){S.models.shift();toast('Облако','Не хватило места. Удали старые модели.');return}
  toast('Облако','Модель «'+rec.name+'» сохранена');render();
}

    '<div class="tools"><button class="chip" data-a="mrot" data-v="-1">↺ Влево</button><button class="chip" data-a="mrot" data-v="1">↻ Вправо</button><button class="chip" data-a="mpitch" data-v="0.15">Сверху</button><button class="chip" data-a="mpitch" data-v="-0.15">Сбоку</button><button class="chip" aria-pressed="'+M.auto+'" data-a="mauto">Крутить само</button></div>'+

    '<section class="card form"><h2>Готовые модели</h2><div class="chips">'+Object.keys(SAMPLES).map(function(k){return '<button class="chip" data-a="msample" data-v="'+k+'">'+SAMPLES[k][0]+'</button>'}).join('')+'</div></section>'+
    '<section class="card form"><h2>Сохранить</h2><div class="send"><input type="text" id="m-name" maxlength="40" placeholder="Название модели" aria-label="Название модели"><button class="btn" data-a="msave">Сохранить</button></div><div class="row"><button class="btn ghost" data-a="mexport">Скачать картинку</button></div>'+gal+'</section>';
};


/* ---------- события ---------- */
document.addEventListener('click',function(e){
  var gm=e.target.closest('[data-gm],[data-gans],[data-gp],[data-g]');
  if(gm&&G){
    if(gm.dataset.g!==undefined&&G.on){G.on(gm.dataset.g,gm);return}
    if(gm.dataset.gm!==undefined&&G.hit)G.hit(+gm.dataset.gm);
    else if(gm.dataset.gans!==undefined&&G.ans)G.ans(+gm.dataset.gans,gm);
    else if(gm.dataset.gp!==undefined&&G.tap)G.tap(+gm.dataset.gp);
    return
  }
  var el=e.target.closest('[data-a]');if(!el)return;
  var a=el.dataset.a,id=+el.dataset.id;
  if(a==='popen'){F.proj=id;F.pending=null;render();window.scrollTo(0,0);return}
  if(a==='pback'){F.proj=null;F.pending=null;render();return}
  if(a==='pdel'){
    var pk='proj'+id;
    if(F.pending===pk){S.projects=S.projects.filter(function(q){return q.id!==id});F.proj=null;F.pending=null;save()}
    else{F.pending=pk;setTimeout(function(){if(F.pending===pk){F.pending=null;if(S.tab==='projects')render()}},3500)}
    render();return;
  }
  var pr=curProj();
  if(pr&&a==='pdone'){var st=pr.steps[+el.dataset.i];if(st){st.d=!st.d;if(st.d){var rc2=el.getBoundingClientRect();burst(rc2.left+rc2.width/2,rc2.top+rc2.height/2);if(pr.steps.every(function(x){return x.d})){var nn=addClouds(10);toast('Облако','Проект «'+pr.title+'» готов! +'+nn+' '+plural(nn));confetti(50)}}save();render()}return}
  if(pr&&a==='pstepdel'){pr.steps.splice(+el.dataset.i,1);save();render();return}
  if(pr&&a==='pask'){projAsk(pr,el.dataset.v);return}
  if(pr&&a==='padd'){var bmsg=pr.chat[+el.dataset.i],list=bmsg?parseSteps(bmsg.t):[];if(!list.length){toast('Облако','Не нашла в ответе пронумерованных пунктов');return}list.forEach(function(x){pr.steps.push({t:x,d:false})});save();render();toast('Облако','Добавила шагов: '+list.length);return}
  if(a==='dtool'){D.tool=el.dataset.v;render();return}
  if(a==='dcol'){D.color=el.dataset.v;if(D.tool==='eraser')D.tool='brush';render();return}
  if(a==='dundo'){dUndo();return}
  if(a==='dclear'){dClear();return}
  if(a==='dgo'){dGo(+el.dataset.i);return}
  if(a==='dadd'){dAdd(false);return}
  if(a==='dcopy'){dAdd(true);return}
  if(a==='ddel'){dDel();return}
  if(a==='dplay'){dPlay();return}
  if(a==='dsave'){dSave();return}
  if(a==='dexport'){if(!D.playing)dCommit();download(compose(D.cv,DW,DH),'oblako-risunok.png');return}
  if(a==='dopen'){dOpen(id);return}
  if(a==='dgdel'){var ak='art'+id;if(F.pending===ak){S.art=S.art.filter(function(x){return x.id!==id});F.pending=null;save()}else{F.pending=ak;setTimeout(function(){if(F.pending===ak){F.pending=null;if(S.tab==='draw')render()}},3500)}render();return}
  if(a==='mtool'){M.tool=el.dataset.v;render();return}
  if(a==='mcol'){M.color=+el.dataset.v;if(M.tool==='erase'||M.tool==='rotate')M.tool='build';render();return}
  if(a==='mrot'){M.yaw+=(+el.dataset.v)*Math.PI/4;mDraw();return}
  if(a==='mpitch'){M.pitch=Math.max(.15,Math.min(1.35,M.pitch+(+el.dataset.v)));mDraw();return}
  if(a==='mauto'){M.auto=!M.auto;if(M.auto)mStart();else mStop();render();return}
  if(a==='mundo'){if(M.undo.length){M.vox=JSON.parse(M.undo.pop());mSave();mDraw()}return}
  if(a==='msample'){mSample(el.dataset.v);return}
  if(a==='msave'){mSaveModel();return}
  if(a==='mexport'){mDraw();download(compose(M.cv,M.W,M.H),'oblako-3d.png');return}
  if(a==='mopen'){var mm=S.models.filter(function(x){return x.id===id})[0];if(mm){mPushUndo();mLoad(mm.v);mSave();render();toast('Облако','Модель открыта')}return}
  if(a==='mdel'){var mk='mod'+id;if(F.pending===mk){S.models=S.models.filter(function(x){return x.id!==id});F.pending=null;save()}else{F.pending=mk;setTimeout(function(){if(F.pending===mk){F.pending=null;if(S.tab==='model')render()}},3500)}render();return}
  if(a==='mclear'){if(F.pending==='mclear'){mPushUndo();M.vox={};mSave();F.pending=null}else{F.pending='mclear';setTimeout(function(){if(F.pending==='mclear'){F.pending=null;if(S.tab==='model')render()}},3500)}render();return}
  if(a==='groqclear'){S.groqKey='';save();render();toast('Облако','Ключ убран с этого телефона');return}
  if(a==='aitest'){var gi=document.getElementById('s-groq');if(gi){S.groqKey=gi.value.trim();save()}SAMPLE_P=null;SAMPLE=null;toast('Облако','Проверяю связь с ИИ…');askAI('Ответь одним словом: привет').then(function(){toast('Облако','ИИ отвечает, можно болтать!');if(S.tab==='chat')render()}).catch(function(){toast('Облако','ИИ не отвечает: '+AI_ERR);if(S.tab==='chat')render()});return}
  if(a==='persona'){S.persona=el.dataset.v;save();render();return}
  if(a==='vpreset'){var pv={boy:[1.22,.95],soft:[1.08,.85],lively:[1.3,1.12]}[el.dataset.v];if(pv){S.vp=pv[0];S.vr=pv[1];save();speak('Привет! Я Облако. Так я буду говорить.','happy',true);toast('Облако','Голос выбран. Если он звучит не так, выбери другой в Настройках → Голос')}return}
  if(a==='vtest'){speak('Привет! Я Облако. Вот так я умею говорить: радостно, грустно и даже немного язвительно.','mock',true);return}
  if(a==='poke'){var opts=EMO_KEYS.filter(function(k){return k!==CH.emo});setEmo(pick(opts));return}
  if(a==='vid'){var vi=document.getElementById('c-vid');if(vi)vi.click();return}
  if(a==='gplay'){openGame(el.dataset.v);return}
  if(a==='gclose'){gClose();return}
  if(a==='gbuy'){buy(el.dataset.v);return}
  if(a==='equip'){equip(el.dataset.v);return}
  if(a==='unequip'){unequip(el.dataset.v);return}
  if(S.tab==='study'){var ta=document.getElementById('s-text');if(ta)F.text=ta.value}
  if(a==='tab'){S.tab=el.dataset.v;F.pending=null;save();render(true);window.scrollTo(0,0);return}
  if(a==='theme'){S.theme=el.dataset.v;save();applyLook(true);render();return}
  if(a==='idea'){var idn=(S.kid?KID:ADULT)[+el.dataset.i];if(idn){S.tasks.unshift({id:uid(),title:idn[0],cat:idn[1],due:null,rem:S.remindMin,rep:0,at:Date.now(),lastRem:0,note:'',done:false,reminded:false});save();toast('Облако','Добавила: '+idn[0]);render()}return}
  if(a==='filter'){F.filter=el.dataset.v;render();return}
  if(a==='done'){
    var rc=el.getBoundingClientRect(),won=false;
    S.tasks.forEach(function(t){if(t.id===id){t.done=!t.done;if(!t.done){t.reminded=false;t.lastRem=0}else{won=true;award(t)}}});
    save();render();if(won)burst(rc.left+rc.width/2,rc.top+rc.height/2);return;
  }
  if(a==='edit'){F.edit=id;render();window.scrollTo(0,0);return}
  if(a==='canceledit'){F.edit=null;render();return}
  if(a==='del'){
    var key=el.dataset.k+id;
    if(F.pending===key){
      if(el.dataset.k==='task')S.tasks=S.tasks.filter(function(t){return t.id!==id});else S.items=S.items.filter(function(i){return i.id!==id});
      F.pending=null;if(F.edit===id&&el.dataset.k==='task')F.edit=null;save();
    }else{F.pending=key;setTimeout(function(){if(F.pending===key){F.pending=null;render()}},3500)}
    render();return;
  }
  if(a==='rmex'){S.tasks=S.tasks.filter(function(t){return !t.ex});S.items=S.items.filter(function(i){return !i.ex});save();render();return}
  if(a==='say'){say(el.dataset.t);return}
  if(a==='clearchat'){S.chat=[];setEmo('neutral');save();render();return}
  if(a==='subj'){F.subj=el.dataset.v;F.out=null;F.seq++;render();return}
  if(a==='mode'){F.mode=el.dataset.v;F.out=null;F.seq++;render();return}
  if(a==='mic'){if(REC){try{REC.stop()}catch(err){}}else startVoice(false);return}
  if(a==='wake'){
    WAKE=!WAKE;
    if(WAKE){startVoice(true);wakeLock(true)}else{if(REC){try{REC.stop()}catch(err){}}wakeLock(false);setVS('')}
    render();return;
  }
  if(a==='perm'){
    try{Notification.requestPermission().then(function(){render();toast('Облако','Если разрешишь, напоминания будут приходить как уведомления.')})}catch(err){toast('Облако','Этот браузер не умеет показывать уведомления. Напоминания будут появляться внутри приложения.')}
    return;
  }
  if(a==='testn'){notify('Облако','Так будет выглядеть напоминание.');return}
  if(a==='reset'){
    if(F.pending==='reset'){try{localStorage.removeItem(K)}catch(err){}S=fresh();S.seeded=true;F.pending=null;save()}
    else{F.pending='reset';setTimeout(function(){if(F.pending==='reset'){F.pending=null;if(S.tab==='settings')render()}},3500)}
    render();return;
  }
});
document.addEventListener('submit',function(e){
  e.preventDefault();var id=e.target.id;
  if(id==='f-name'){var v=document.getElementById('n-name').value.trim();if(v){S.name=v;save();render()}}
  else if(id==='f-ask'){var q=document.getElementById('q-ask').value;say(q)}
  else if(id==='f-chat'){say(document.getElementById('c-in').value)}
  else if(id==='f-proj'){
    var pt=document.getElementById('pr-title').value.trim();if(!pt)return;
    var pk2=document.getElementById('pr-kind').value,np={id:uid(),title:pt,kind:pk2,goal:document.getElementById('pr-goal').value.trim(),steps:(PSTEPS[pk2]||PSTEPS.own).map(function(x){return {t:x,d:false}}),notes:'',chat:[],at:Date.now()};
    S.projects.unshift(np);F.proj=np.id;save();render();window.scrollTo(0,0);toast('Облако','Проект создан. Я добавила первые шаги, их можно менять.');
  }
  else if(id==='f-pstep'){var ppp=curProj(),sv=document.getElementById('ps-in').value.trim();if(ppp&&sv){ppp.steps.push({t:sv,d:false});save();render()}}
  else if(id==='f-pchat'){var pp2=curProj();if(pp2)projAsk(pp2,'free',document.getElementById('p-in').value)}
  else if(id==='f-task'){
    var title=document.getElementById('t-title').value.trim();if(!title)return;
    var dv=document.getElementById('t-due').value,rec={title:title,cat:document.getElementById('t-cat').value,due:dv?new Date(dv).toISOString():null,rem:+document.getElementById('t-rem').value,rep:+document.getElementById('t-rep').value,note:document.getElementById('t-note').value.trim()};
    if(F.edit){S.tasks.forEach(function(t){if(t.id===F.edit){Object.assign(t,rec);t.reminded=false;t.lastRem=0;t.ex=false}});F.edit=null}
    else S.tasks.unshift(Object.assign({id:uid(),done:false,reminded:false,at:Date.now(),lastRem:0},rec));
    save();render();tick();
  }
  else if(id==='f-item'){
    var n=document.getElementById('i-name').value.trim(),l=document.getElementById('i-loc').value.trim();
    if(n&&l){S.items.unshift({id:uid(),name:n,loc:l,note:document.getElementById('i-note').value.trim(),at:Date.now()});F.q='';save();render()}
  }
  else if(id==='f-study'){
    var tx=document.getElementById('s-text').value;F.text=tx;
    if(!tx.trim()){F.out='<p class="meta">Напиши тему или задание, и я помогу.</p>'}else{var la=studyAnswer(F.subj,F.mode,tx);if(la.def){F.out=la.html}else{F.out='<p class="meta">Думаю…</p>';runAI(F.subj,F.mode,tx,la)}}
    render();
  }
});
document.addEventListener('input',function(e){
  var tid=e.target.id;
  if(tid==='p-notes'){var pn=curProj();if(pn){pn.notes=e.target.value;save()}return}
  if(tid==='d-size'){D.size=+e.target.value;return}
  if(tid==='d-cust'){D.color=e.target.value;if(D.tool==='eraser')D.tool='brush';return}
  if(tid==='d-fps'){D.fps=+e.target.value;var fv=document.getElementById('d-fpsv');if(fv)fv.textContent=D.fps;if(D.playing){dStopPlay();dPlay()}return}
  if(e.target.id==='i-q'){F.q=e.target.value;var l=document.getElementById('i-list');if(l)l.innerHTML=itemList()}
});
document.addEventListener('change',function(e){
  if(e.target.id==='d-onion'){D.onion=e.target.checked;dOnion();return}
  if(e.target.id==='c-vid'){var vf=e.target.files&&e.target.files[0];e.target.value='';handleVideo(vf);return}
  var k=e.target.dataset&&e.target.dataset.set;if(!k)return;
  if(k==='groq')S.groqKey=e.target.value.trim();
  else if(k==='polite'||k==='speakChat'){S[k]=e.target.checked;save();if(k==='polite')render();return}
  else if(k==='emoOn'){S.emoOn=e.target.checked;save();var cm=document.getElementById('cmini');if(cm)cm.innerHTML=miniHtml();return}
  else if(k==='vname')S.vname=e.target.value;
  else if(k==='vp'||k==='vr')S[k]=+e.target.value;
  else if(k==='name')S.name=e.target.value.trim();
  else if(k==='remindMin')S.remindMin=+e.target.value;
  else if(k==='defRep')S.defRep=+e.target.value;
  else if(k==='speak')S.speak=e.target.checked;
  else if(k==='kid'){S.kid=e.target.checked;applyLook(true);save();render();return}
  else if(k==='anim'){S.anim=e.target.checked;applyLook(true)}
  else if(k==='qon')S.quiet.on=e.target.checked;
  else if(k==='qs')S.quiet.start=e.target.value||'22:00';
  else if(k==='qe')S.quiet.end=e.target.value||'07:00';
  save();
});
document.addEventListener('toggle',function(e){if(e.target&&e.target.id==='cset')F.copen=e.target.open},true);
document.addEventListener('visibilitychange',function(){if(!document.hidden)tick()});

applyLook();daily();render(true);tick();setInterval(tick,20000);
})();
